<svg width="640" height="520" viewBox="0 0 640 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Multimodal skin biology analysis">
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="640" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B2340"/><stop offset="1" stop-color="#081A30"/>
    </linearGradient>
    <linearGradient id="tg" x1="120" y1="90" x2="470" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF"/><stop offset="1" stop-color="#0B7285"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop stop-color="#12A594" stop-opacity="0.45"/><stop offset="1" stop-color="#12A594" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="face"><path d="M300 96c58 0 96 44 104 96 4 26 14 30 20 44 5 12-4 20-14 22-3 24-6 40-30 54-8 5-10 8-10 20v34H236V300c-40-18-58-58-52-104C192 140 236 96 300 96Z"/></clipPath>
  </defs>

  <rect width="640" height="520" rx="28" fill="url(#hg)"/>
  <ellipse cx="330" cy="230" rx="300" ry="240" fill="url(#glow)"/>

  <!-- data ring -->
  <g opacity="0.5" stroke="#2DD4BF" stroke-width="1.2">
    <circle cx="330" cy="250" r="196" fill="none" stroke-dasharray="3 9"/>
    <circle cx="330" cy="250" r="150" fill="none" stroke-dasharray="2 12" opacity="0.6"/>
  </g>

  <!-- face silhouette -->
  <g transform="translate(30,60)">
    <path d="M300 96c58 0 96 44 104 96 4 26 14 30 20 44 5 12-4 20-14 22-3 24-6 40-30 54-8 5-10 8-10 20v34H236V300c-40-18-58-58-52-104C192 140 236 96 300 96Z" fill="url(#tg)" opacity="0.16" stroke="#2DD4BF" stroke-width="1.5"/>
    <!-- scan lines -->
    <g clip-path="url(#face)" stroke="#2DD4BF" stroke-width="1" opacity="0.55">
      <line x1="180" y1="150" x2="440" y2="150"/><line x1="180" y1="185" x2="440" y2="185"/>
      <line x1="180" y1="220" x2="440" y2="220"/><line x1="180" y1="255" x2="440" y2="255"/>
      <line x1="180" y1="290" x2="440" y2="290"/><line x1="180" y1="325" x2="440" y2="325"/>
      <line x1="180" y1="360" x2="440" y2="360"/><line x1="180" y1="395" x2="440" y2="395"/>
    </g>
    <!-- biomarker nodes over the face -->
    <g fill="#EAFBF7">
      <circle cx="268" cy="205" r="5"/><circle cx="330" cy="180" r="4"/><circle cx="360" cy="245" r="5"/>
      <circle cx="285" cy="285" r="4"/><circle cx="345" cy="315" r="5"/><circle cx="300" cy="350" r="4"/>
    </g>
    <g stroke="#2DD4BF" stroke-width="1.3" opacity="0.8">
      <line x1="268" y1="205" x2="330" y2="180"/><line x1="330" y1="180" x2="360" y2="245"/>
      <line x1="360" y1="245" x2="345" y2="315"/><line x1="345" y1="315" x2="300" y2="350"/>
      <line x1="300" y1="350" x2="285" y2="285"/><line x1="285" y1="285" x2="268" y2="205"/>
    </g>
  </g>

  <!-- floating molecule (proteomics) -->
  <g transform="translate(70,330)" opacity="0.95">
    <circle cx="0" cy="0" r="34" fill="#0B2340" stroke="#2DD4BF" stroke-width="1.5"/>
    <g stroke="#2DD4BF" stroke-width="1.4"><line x1="-14" y1="-8" x2="0" y2="4"/><line x1="0" y1="4" x2="16" y2="-6"/><line x1="0" y1="4" x2="4" y2="20"/></g>
    <g fill="#2DD4BF"><circle cx="-14" cy="-8" r="4"/><circle cx="0" cy="4" r="4"/><circle cx="16" cy="-6" r="4"/><circle cx="4" cy="20" r="4"/></g>
  </g>

  <!-- mini analytics card (explainable AI output) -->
  <g transform="translate(432,300)">
    <rect x="0" y="0" width="176" height="150" rx="16" fill="#FFFFFF"/>
    <rect x="16" y="16" width="90" height="9" rx="4.5" fill="#0B2340"/>
    <rect x="16" y="34" width="60" height="7" rx="3.5" fill="#94A3B8"/>
    <g>
      <rect x="16" y="66" width="144" height="9" rx="4.5" fill="#E6EAF0"/><rect x="16" y="66" width="120" height="9" rx="4.5" fill="#12A594"/>
      <rect x="16" y="88" width="144" height="9" rx="4.5" fill="#E6EAF0"/><rect x="16" y="88" width="82" height="9" rx="4.5" fill="#0B7285"/>
      <rect x="16" y="110" width="144" height="9" rx="4.5" fill="#E6EAF0"/><rect x="16" y="110" width="52" height="9" rx="4.5" fill="#2DD4BF"/>
    </g>
  </g>

  <!-- score chip -->
  <g transform="translate(60,90)">
    <rect x="0" y="0" width="120" height="56" rx="14" fill="#12A594"/>
    <text x="16" y="24" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#EAFBF7">Integrated score</text>
    <text x="16" y="46" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">72<tspan font-size="12" fill="#CFF6EE">/100</tspan></text>
  </g>
</svg>
